# Scripts de instalación de dependencias: pnpm los bloquea si no están revisados.
# esbuild y workerd (vienen con wrangler) no los necesitan para desplegar archivos
# estáticos: sus binarios llegan como paquetes opcionales por plataforma.
allowBuilds:
  esbuild: false
  workerd: false

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.6'
  - '@astrojs/prism@4.1.2'
  - '@astrojs/telemetry@3.4.2'
  - astro@7.4.3
